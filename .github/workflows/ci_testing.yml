name: CI complete testing

# see: https://help.github.com/en/actions/reference/events-that-trigger-workflows
on: # Trigger the workflow on push or pull request, but only for the main branch
  push:
    branches: [main]
  pull_request: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

jobs:
  synth-datasets-no-torch:
    # `torch` moved from a hard dependency to the `torch` extra: `synth_datasets` installs and
    # imports without it (see src/synth_datasets/__init__.py). This leg proves that promise by never
    # installing torch at all, rather than relying on --group dev (which does need torch, for the
    # rest of the suite) to happen to omit it. Scoped to the torch-free surface only; the augmentation
    # stack and its cross-package integration tests need torch and run in `pytester` below.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.10"
    timeout-minutes: 5
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v7.2.0
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
          activate-environment: true
      - name: 📦 Install base package, no extras, no torch
        timeout-minutes: 5
        run: |
          uv pip install -e . "pytest>=8.3,<8.5" "pytest-doctestplus>=1.3" "pyyaml>=6"
          uv pip list
      - name: 🚫 Confirm torch did not sneak in
        run: "! uv pip show torch"
      - name: 🧯 Confirm the torch-extra message fires
        # The augmentation stack is torch-only, so importing it here must fail -- but with the
        # actionable "install the extra" message from src/fused_transforms/__init__.py, not a raw
        # ModuleNotFoundError from somewhere deep inside the package. Exit status is checked
        # separately from the message so a shell with `pipefail` cannot turn the expected failure
        # into a red step.
        run: |
          if python -c 'import fused_transforms' 2> "${RUNNER_TEMP}/import_err.txt"; then
            echo "::error::importing fused_transforms succeeded without torch installed"
            exit 1
          fi
          grep -qF 'vision-synth[torch]' "${RUNNER_TEMP}/import_err.txt"
      - name: 🧪 Run torch-free tests and doctests
        run: pytest src/synth_datasets tests/test_unit/test_synth_datasets --ignore=src/synth_datasets/export/datasets.py -v

  doctests-only:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extras: ["torch", "all", "albumentations", "kornia", "torchvision"]
    env:
      UV_TORCH_BACKEND: cpu
      PYTHON_VERSION: "3.10"
    timeout-minutes: 5
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v7.2.0
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
          activate-environment: true
      - name: 📦 Install base package (no extras)
        timeout-minutes: 5
        run: |
          uv pip install -e ".[${{ matrix.extras }}]" --group dev
          uv pip list
      - name: 🧪 Run doctests
        run: pytest src/ -v

  pytester:
    needs: [doctests-only, synth-datasets-no-torch]
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        requires: ["latest"]
        extras: ["all", "albumentations", "kornia", "torchvision"]
        include:
          - { os: "windows-latest", extras: "all", python-version: "3.12" }
          - { os: "macOS-latest", extras: "all", python-version: "3.12" }
          - { os: "ubuntu-latest", extras: "all", python-version: "3.10", requires: "oldest" }
    env:
      UV_TORCH_BACKEND: cpu
    # Timeout: https://stackoverflow.com/a/59076067/4521646
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v7.2.0
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
      - name: 📌 Pin minimum dependencies
        if: matrix.requires == 'oldest'
        run: |
          uv pip install tomlkit fire
          python .github/scripts/min_deps.py
      - name: 📦 Install dependencies
        timeout-minutes: 5
        run: |
          uv pip install -e ".[${{ matrix.extras }}]" --group dev
          uv pip list
      - name: 📝 Generate documentation example tests
        if: matrix.extras == 'all'
        run: python .github/scripts/generate_doc_tests.py
      - name: 🧪 Run tests
        run: pytest . -v --cov=fused_transforms --cov=synth_datasets
      - name: 📊 Coverage statistics
        run: |
          coverage report
          coverage xml
      - name: ☁️ Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        # see: https://github.com/actions/toolkit/issues/399
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: "coverage.xml"
          flags: cpu,${{ runner.os }},py${{ matrix.python-version }}
          env_vars: OS,PYTHON
          name: codecov-umbrella
          fail_ci_if_error: false

  testing-guardian:
    permissions: {}
    runs-on: ubuntu-latest
    needs: pytester
    if: always()
    steps:
      - run: echo "${{ needs.pytester.result }}"
      - name: ❌ Fail on test failure
        if: needs.pytester.result == 'failure'
        run: exit 1
      - name: ⏭️ Fail on cancel or skip
        if: contains(fromJSON('["cancelled", "skipped"]'), needs.pytester.result)
        timeout-minutes: 1
        run: sleep 90
