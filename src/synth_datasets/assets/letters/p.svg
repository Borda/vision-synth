  <circle id="kp-mid_left" zoo:name="mid_left" cx="252.000" cy="500.000" r="8" fill="#3cb44b" stroke="#ffffff" stroke-width="1.5" />
  <circle id="kp-mid_right" zoo:name="mid_right" cx="580.000" cy="500.000" r="8" fill="#bfef45" stroke="#ffffff" stroke-width="1.5" />
  <circle id="kp-bottom_left" zoo:name="bottom_left" cx="252.000" cy="900.000" r="8" fill="#808000" stroke="#ffffff" stroke-width="1.5" />
