<svg xmlns="http://www.w3.org/2000/svg" xmlns:zoo="https://github.com/Borda/vision-synth/ns/zoo" viewBox="0 0 1000 1000" width="1000" height="1000" zoo:archetype="stroke-graph" zoo:title="capital letter P" zoo:origin="hand-authored" zoo:license="https://creativecommons.org/publicdomain/zero/1.0/" zoo:note="Stroke graph, not an outline: the silhouette is generated by stroking these edges at load time, so stroke width and counter gap stay tunable and a node stays one draggable point. Converted from the former letters.json literal; node coordinates are the authored grid values scaled by 400 about a 1000x1000 centre. Save as Plain SVG, never Optimized SVG (it strips the zoo: namespace).">
  <title>capital letter P</title>
  <g id="strokes">
  <line zoo:start="top_left" zoo:end="top_mid" zoo:bulge="-0.1" x1="252.000" y1="100.000" x2="460.000" y2="100.000" stroke="#000000" stroke-width="10" stroke-linecap="round" />
  <line zoo:start="top_mid" zoo:end="top_right" zoo:bulge="-0.1" x1="460.000" y1="100.000" x2="620.000" y2="140.000" stroke="#000000" stroke-width="10" stroke-linecap="round" />
  <line zoo:start="top_right" zoo:end="upper_right" zoo:bulge="-0.1" x1="620.000" y1="140.000" x2="700.000" y2="300.000" stroke="#000000" stroke-width="10" stroke-linecap="round" />
  <line zoo:start="upper_right" zoo:end="mid_right" zoo:bulge="-0.1" x1="700.000" y1="300.000" x2="580.000" y2="500.000" stroke="#000000" stroke-width="10" stroke-linecap="round" />
  <line zoo:start="mid_right" zoo:end="mid_left" x1="580.000" y1="500.000" x2="252.000" y2="500.000" stroke="#000000" stroke-width="10" stroke-linecap="round" />
  <line zoo:start="top_left" zoo:end="mid_left" x1="252.000" y1="100.000" x2="252.000" y2="500.000" stroke="#000000" stroke-width="10" stroke-linecap="round" />
  <line zoo:start="mid_left" zoo:end="bottom_left" x1="252.000" y1="500.000" x2="252.000" y2="900.000" stroke="#000000" stroke-width="10" stroke-linecap="round" />
  </g>
  <g id="cuts">
  <line zoo:start="mid_left" zoo:end="mid_right" zoo:cut="0.27" x1="252.000" y1="500.000" x2="580.000" y2="500.000" stroke="#ff3b30" stroke-width="4" stroke-dasharray="6 6" />
  </g>
  <g id="nodes">
  <circle id="kp-top_left" zoo:name="top_left" cx="252.000" cy="100.000" r="8" fill="#e6194b" stroke="#ffffff" stroke-width="1.5" />
  <circle id="kp-top_mid" zoo:name="top_mid" cx="460.000" cy="100.000" r="8" fill="#ffe119" stroke="#ffffff" stroke-width="1.5" />
