<svg xmlns="http://www.w3.org/2000/svg" xmlns:zoo="https://github.com/Borda/vision-synth/ns/zoo" viewBox="0 0 1000 1000" width="1000" height="1000" zoo:archetype="stroke-graph" zoo:title="capital letter M" zoo:origin="hand-authored" zoo:license="https://creativecommons.org/publicdomain/zero/1.0/" zoo:note="Stroke graph, not an outline: the silhouette is generated by stroking these edges at load time, so stroke width and counter gap stay tunable and a node stays one draggable point. Converted from the former letters.json literal; node coordinates are the authored grid values scaled by 400 about a 1000x1000 centre. Save as Plain SVG, never Optimized SVG (it strips the zoo: namespace).">
  <title>capital letter M</title>
  <g id="strokes">
  <line zoo:start="top_left" zoo:end="center" x1="252.000" y1="100.000" x2="500.000" y2="500.000" stroke="#000000" stroke-width="10" stroke-linecap="round" />
  <line zoo:start="center" zoo:end="top_right" x1="500.000" y1="500.000" x2="748.000" y2="100.000" stroke="#000000" stroke-width="10" stroke-linecap="round" />
  <line zoo:start="top_left" zoo:end="bottom_left" x1="252.000" y1="100.000" x2="252.000" y2="900.000" stroke="#000000" stroke-width="10" stroke-linecap="round" />
  <line zoo:start="top_right" zoo:end="bottom_right" x1="748.000" y1="100.000" x2="748.000" y2="900.000" stroke="#000000" stroke-width="10" stroke-linecap="round" />
  </g>
  <g id="nodes">
