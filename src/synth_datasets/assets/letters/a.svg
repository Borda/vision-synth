<svg xmlns="http://www.w3.org/2000/svg" xmlns:zoo="https://github.com/Borda/vision-synth/ns/zoo" viewBox="0 0 1000 1000" width="1000" height="1000" zoo:archetype="stroke-graph" zoo:title="capital letter A" zoo:origin="hand-authored" zoo:license="https://creativecommons.org/publicdomain/zero/1.0/" zoo:note="Stroke graph, not an outline: the silhouette is generated by stroking these edges at load time, so stroke width and counter gap stay tunable and a node stays one draggable point. Converted from the former letters.json literal; node coordinates are the authored grid values scaled by 400 about a 1000x1000 centre. Save as Plain SVG, never Optimized SVG (it strips the zoo: namespace).">
  <title>capital letter A</title>
  <g id="strokes">
  <line zoo:start="top_mid" zoo:end="lower_left" x1="500.000" y1="100.000" x2="314.000" y2="700.000" stroke="#000000" stroke-width="10" stroke-linecap="round" />
  <line zoo:start="lower_left" zoo:end="bottom_left" x1="314.000" y1="700.000" x2="252.000" y2="900.000" stroke="#000000" stroke-width="10" stroke-linecap="round" />
  <line zoo:start="top_mid" zoo:end="lower_right" x1="500.000" y1="100.000" x2="686.000" y2="700.000" stroke="#000000" stroke-width="10" stroke-linecap="round" />
  <line zoo:start="lower_right" zoo:end="bottom_right" x1="686.000" y1="700.000" x2="748.000" y2="900.000" stroke="#000000" stroke-width="10" stroke-linecap="round" />
  <line zoo:start="lower_left" zoo:end="lower_right" x1="314.000" y1="700.000" x2="686.000" y2="700.000" stroke="#000000" stroke-width="10" stroke-linecap="round" />
  </g>
  <g id="cuts">
  <line zoo:start="lower_left" zoo:end="lower_right" zoo:cut="0.5" x1="314.000" y1="700.000" x2="686.000" y2="700.000" stroke="#ff3b30" stroke-width="4" stroke-dasharray="6 6" />
  </g>
  <g id="nodes">
  <circle id="kp-top_mid" zoo:name="top_mid" cx="500.000" cy="100.000" r="8" fill="#ffe119" stroke="#ffffff" stroke-width="1.5" />
  <circle id="kp-lower_left" zoo:name="lower_left" cx="314.000" cy="700.000" r="8" fill="#ffd8b1" stroke="#ffffff" stroke-width="1.5" />
  <circle id="kp-lower_right" zoo:name="lower_right" cx="686.000" cy="700.000" r="8" fill="#fabed4" stroke="#ffffff" stroke-width="1.5" />
  <circle id="kp-bottom_left" zoo:name="bottom_left" cx="252.000" cy="900.000" r="8" fill="#808000" stroke="#ffffff" stroke-width="1.5" />
  <circle id="kp-bottom_right" zoo:name="bottom_right" cx="748.000" cy="900.000" r="8" fill="#469990" stroke="#ffffff" stroke-width="1.5" />
  </g>
</svg>
